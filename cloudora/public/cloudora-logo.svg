<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">Cloudora logo</title>
  <desc id="desc">Blue rounded-square cloud icon with a white C, followed by the dark CLOUDORA wordmark.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1457F5"/>
      <stop offset="1" stop-color="#0737C8"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18D0F4"/>
      <stop offset="1" stop-color="#2692FF"/>
    </linearGradient>
  </defs>

  <!-- App icon -->
  <rect x="20" y="20" width="140" height="140" rx="30" fill="url(#tile)"/>

  <!-- Cloud outline -->
  <path d="M49 105
           C38 105 30 96 30 85
           C30 74 39 65 50 65
           C54 47 70 35 88 35
           C108 35 124 49 127 68
           C140 70 149 80 149 93
           C149 107 138 117 124 117
           L52 117"
        fill="none" stroke="url(#cloud)" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stylized C -->
  <path d="M103 65
           C97 59 90 56 82 56
           C66 56 55 68 55 83
           C55 98 66 110 82 110
           C90 110 97 107 103 101"
        fill="none" stroke="#FFFFFF" stroke-width="12"
        stroke-linecap="butt" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="190" y="108"
        font-family="Inter, Montserrat, Arial, sans-serif"
        font-size="54" font-weight="600" letter-spacing="1.1"
        fill="#111827">CLOUDORA</text>
</svg>
